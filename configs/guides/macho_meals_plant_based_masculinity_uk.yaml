# The general research aim is retained in the top-level description and moderator_knowledge_brief.
# This avoids giving the moderator inferred analytical framing at the question level.
#
# AUTHORITY (2026-07-28): this file is NOT the source of truth for synthetic runs.
# The canonical guide is the inlined `discussion_guide` array in
# configs/experiment/macho_meals_fg1_run01.json, which is what actually executes —
# nothing in core/ or scripts/run_full_session.py reads this YAML at runtime.
# This file was synchronised to that canonical version on 2026-07-28 after the two
# had drifted apart (section 0's scripted_question was 241 characters shorter here,
# missing the recording disclosure and the go-around instruction; section 1's phase
# was "intro" rather than "context"). Keep the two in step: if the canonical config
# changes, mirror the change here — do not edit this file expecting a run to pick it up.

# Phase-name mapping convention for Krueger-format guides
# (discovered when porting guides to the system's SectionPhase enum):
#
#   Krueger term     → system SectionPhase value
#   ─────────────────────────────────────────────
#   opening          → intro
#   introductory     → context
#   transition       → context
#   key              → main_topic
#   stimulus task    → stimulus
#   ending / closing → closing
#
# Future guides adapted from Krueger-format interview schedules should
# follow this mapping. The enum values are defined in core/session_state.py.

guide_id: macho_meals_plant_based_masculinity_uk

title: "Macho meals? Traditional masculine norms and animal product consumption in the UK"
description: |
  Focus group guide exploring how men in the UK make everyday food
  choices, how social context, work, hobbies, health, taste and other
  people shape what they eat, how gender and masculinity may influence
  food choices, and what would need to change for plant-based foods to
  become more acceptable or appealing.

topic_domain: "Masculinity, food choice, animal product consumption, and plant-based eating"
participant_collective_identity: "Men in the UK reflecting on food choices, male friendship, gender norms, and plant-based eating"
moderator_knowledge_brief: |
  Explore (1) everyday food decision-making, (2) the social contexts in
  which men spend time with male friends, (3) the influence of other
  people, work, hobbies, health, nutrition and taste on food choices,
  (4) whether participants perceive gender as shaping what they eat,
  (5) social acceptability and gendered meanings attached to vegetarian,
  vegan, plant-based, feminine or masculine foods, and (6) what personal,
  social and practical changes would make plant-based eating more viable
  or appealing. The discussion should remain exploratory, non-judgmental,
  and non-leading.

sections:
  - label: "Introduction and instructions"
    phase: "intro"
    scripted_question: |
      Hi everyone, thanks so much for joining the focus group today. We’re
      going to take about 45 minutes to talk about your food choices and
      opinions, and this will be recorded for research purposes. Try not to
      overthink the questions, and simply speak freely. There are no right
      or wrong answers. Please be respectful of your fellow focus group
      members, and keep your responses relatively brief to allow time for
      everyone to speak. But remember that this is a conversation, not an
      interview, so you can jump in when you have something to say and you
      don’t have to take turns answering each question, but you can if you
      want to. Okay great, let’s start by going around and saying your name
      and where in the UK you’re coming from today.

  - label: "Opening discussion: male friendship and place"
    # phase is "context", not "intro", despite the "Opening discussion" label.
    # The Krueger mapping above sends `opening → intro`, but in Krueger terms
    # this is the *introductory question* (`introductory → context`), not the
    # opening/ice-breaker. Synchronised from the canonical inlined guide.
    phase: "context"
    scripted_question: |
      What’s your favourite place in your city to spend time with your male
      friends? Why? Feel free to be specific.

  - label: "Everyday food decision-making"
    phase: "context"
    scripted_question: |
      How do you decide what to eat?
    suggested_probes:
      - "Do other people influence what you eat? If so, tell us more about how."
      - "Do your work or hobbies influence what foods you eat? Tell us more about how."
      - "How important is health and nutrition?"
      - "How important is taste?"

  - label: "Gender and food choice"
    phase: "main_topic"
    scripted_question: |
      Do you think your gender influences what you eat? Tell us more about
      why or why not.
    suggested_probes:
      - "Is it socially acceptable for men to eat vegetarian or vegan foods?"
      - "Are some foods considered feminine?"
      - "Are some foods considered masculine?"

  - label: "Imagining a plant-based shift"
    phase: "main_topic"
    scripted_question: |
      Imagine you decided to go plant-based — what would need to change in
      your life for you to do that?
    suggested_probes:
      - "How would your family and friends react to this?"
      - "How might it change the way you shop or cook?"

  - label: "Making plant-based foods more appealing"
    phase: "main_topic"
    scripted_question: |
      What might make plant-based foods more appealing to you or other men
      you know?

  - label: "Closing remarks"
    phase: "closing"
    scripted_question: |
      Okay everyone, that’s our time. Thanks so much for participating
      today. Before we finish, is there anything else you would like to add
      about food choices, gender, masculinity, or plant-based eating?
